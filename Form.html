<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="pro.css">
    <link rel="stylesheet" href="bid.html">
</head>
<body>
   <div class="navigation">

    <img src="Imperial.png" class="logo">

    <div class="menu-btn" onclick="toggleMenu()">
        &#9776;
    </div>

    <div class="mainnav" id="navLinks">
        <a href="Home.html">Home</a>
        <a href="Auction.html">Art Information</a>
        <a href="Bid.html">Auction</a>
        <a href="#">About Us</a>
        <a href="Form.html">SignUp / Login</a>
    </div>

</div>
    
    <div class="login" >
        <form id="signupform" onsubmit="return formValidation()" >
            <div class="head">
                <h2>SIGN UP</h2>
                <h4>Create an account to make bidding fast and easy!.</h4>
            </div>
            <div class="form-wrap">
                <input type="text" placeholder="First Name" id="firstName">
                <input type="text" placeholder="Last Name" id="lastName">
            </div>

            <div class="form-wrap">
                <input type="email" placeholder="Email" id="email">
            </div>

            <div class="form-wrap">
                <input type="password"
                    placeholder="Password (must contain 7 or more characters)"
                    id="pass">
            </div>

            <div class="form-wrap">
                <input type="password"
                    placeholder="Confirm Password"
                    id="pass2">
            </div>

            <div class="form-wrap">
                <input type="checkbox" id="newsletter">
                Email me new arrivals and personalized recommendations from ArtBid auction houses.
            </div>

            <div class="form-wrap">
                <input type="checkbox" id="policy">
                I have read and accept Invaluable's terms of service and privacy policy.
            </div>
            <div class="button-wrap">
                 <input type="submit" value="Continue">
            </div>
        </form> 
    </div>
    <script>
        function formValidation() {
            let name = document.getElementById("firstName").value.trim();
            let lastName = document.getElementById("lastName").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("pass").value;
            let confirmPassword = document.getElementById("pass2").value;
            let policy = document.getElementById("policy").checked;

            if (name === "" || lastName === "" || email === "" || password === "" || confirmPassword === "") {
                alert("Please fill in all the fields.");
                return false;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password.length < 7) {
                alert("Password must contain 7 or more characters.");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return false;
            }

            if (!policy) {
                alert("Please accept the terms of service and privacy policy.");
                return false;
            }

            alert("Registration successful!");

            return true;
        }
    </script>
</body>
</html>
